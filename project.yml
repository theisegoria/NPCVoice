# Xcode project for the NPCVoice app (generate with `xcodegen generate`).
# The engine lives in the Swift package at the repo root; the app links NPCKit.
name: NPCVoice
options:
  bundleIdPrefix: dev.npcvoice
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
packages:
  NPCVoicePackage:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ARCHS: arm64
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
targets:
  NPCVoice:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: NPCVoicePackage
        product: NPCKit
      - package: NPCVoicePackage
        product: NPCMLX
      - package: NPCVoicePackage
        product: NPCSpeech
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.npcvoice.NPCVoice
        PRODUCT_NAME: NPCVoice
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: NPCVoice
        CFBundleName: NPCVoice
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "27.0"
        NSHumanReadableCopyright: "© 2026 Ben Haire"
        CFBundleDocumentTypes:
          - CFBundleTypeName: NPCVoice Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes: [dev.npcvoice.project]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.npcvoice.project
            UTTypeDescription: NPCVoice Project
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [npcproj]
  # Binary SDK: C ABI (npc_core.h, npc_sdk.h) + Swift API (NPCVoiceRuntime).
  NPCVoiceKit:
    type: framework
    platform: macOS
    sources:
      - path: Framework/Sources
      - path: Framework/Headers
        headerVisibility: public
      # The canonical C ABI headers (shared with the SwiftPM build), not copies.
      - path: Sources/NPCCore/include/npc_core.h
        headerVisibility: public
      - path: Sources/NPCCore/include/npc_sdk.h
        headerVisibility: public
    dependencies:
      - package: NPCVoicePackage
        product: NPCKit
      - package: NPCVoicePackage
        product: NPCMLX
      - package: NPCVoicePackage
        product: NPCSpeech
      - package: NPCVoicePackage
        product: NPCVoiceSDK
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.npcvoice.NPCVoiceKit
        PRODUCT_NAME: NPCVoiceKit
        GENERATE_INFOPLIST_FILE: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        SKIP_INSTALL: NO
        DEFINES_MODULE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Keep the @_cdecl C ABI exported even though nothing in-framework calls it.
        DEAD_CODE_STRIPPING: NO
        OTHER_LDFLAGS: ["-Wl,-exported_symbol,_npc_*", "-Wl,-exported_symbol,_$s11NPCVoiceKit*"]
    postBuildScripts:
      - name: Embed MLX Metal library
        basedOnDependencyAnalysis: false
        script: |
          # MLX finds default.metallib through its SwiftPM resource bundle, which must
          # live inside this framework (Bundle(for:) of the statically linked code).
          src="${BUILT_PRODUCTS_DIR}/mlx-swift_Cmlx.bundle"
          dst="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/mlx-swift_Cmlx.bundle"
          if [ -d "$src" ]; then rm -rf "$dst"; cp -RL "$src" "$dst"; fi   # -L: archive builds symlink the bundle
          # MLX also checks <binary dir>/Resources/mlx.metallib, which works for any host
          # (apps, command-line tools, plugins), unlike the bundle search.
          cp "$dst/Contents/Resources/default.metallib" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/mlx.metallib"
schemes:
  NPCVoice:
    build:
      targets:
        NPCVoice: all
    run:
      config: Debug
  # Package tests that need Metal (MLX) must run under xcodebuild, not `swift test`.
  NPCVoiceTests:
    build:
      targets:
        NPCVoice: all
    test:
      targets:
        - package: NPCVoicePackage/NPCMLXTests
        - package: NPCVoicePackage/NPCKitTests
        - package: NPCVoicePackage/NPCTokenizerTests
